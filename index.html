
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1428a0">
<title>Samsung Dashboard</title>

<style>
:root {
  --blue:#1428a0;
  --blue-light:#e9edff;
  --bg:#f4f6fa;
  --white:#fff;
  --text:#172033;
  --muted:#70798c;
  --border:#e3e8f0;
  --green:#16834a;
  --red:#e52c2c;
  --orange:#df8218;
  --radius:15px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{height:76px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}
.brand{font-size:21px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
.userbox{display:flex;align-items:center;gap:14px;font-size:13px}
.user-name{text-align:right;font-weight:700}
.user-code{color:var(--muted);font-size:12px;margin-top:3px}
.layout{display:flex;min-height:calc(100vh - 76px)}
.sidebar{width:234px;background:#fff;border-right:1px solid var(--border);padding:16px 12px;flex-shrink:0}
.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;color:#354052;padding:13px 14px;margin-bottom:7px;border-radius:11px;font-size:14px}
.navbtn:hover,.navbtn.active{background:var(--blue-light);color:var(--blue);font-weight:700}
.main{flex:1;min-width:0;padding:25px 24px 40px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:25px;letter-spacing:-.6px;margin:0 0 5px}
.subtitle{font-size:13px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input,select{width:100%;min-height:44px;border:1px solid #d7deea;border-radius:10px;background:white;padding:10px 12px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1428a015}
.month-input{width:160px}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:11px 15px;font-weight:700;font-size:13px;color:var(--text)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#0e1d7b}
.btn:disabled{opacity:.5;cursor:not-allowed}
.metric-btn.active{background:var(--blue);border-color:var(--blue);color:white}
.card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;min-width:0}
.card-title{font-size:15px;font-weight:800;margin-bottom:6px}
.card-subtitle{font-size:12px;color:var(--muted);margin-bottom:15px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:17px}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.kpi-value{font-size:27px;letter-spacing:-.7px;font-weight:800;overflow-wrap:anywhere}
.kpi-note{font-size:11px;color:var(--muted);margin-top:7px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.weekbox{border:1px solid var(--border);border-radius:12px;padding:14px}
.weekname{font-size:12px;font-weight:800}
.weekvalue{font-size:22px;font-weight:800;margin:8px 0}
.weekdate{font-size:11px;color:var(--muted)}
.table-wrap{overflow:auto;width:100%}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:500px}
th{text-align:left;background:#f6f7fa;color:#70798c;font-size:11px;text-transform:uppercase;padding:13px 12px;white-space:nowrap}
td{padding:13px 12px;border-top:1px solid #edf0f5}
td:first-child{font-weight:700}
.empty{text-align:center;padding:26px 12px;color:#8b95a7;font-size:13px}
.good{color:var(--green);font-weight:800}
.bad{color:var(--red);font-weight:800}
.warn{color:var(--orange);font-weight:800}
.focus-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.focus-item{border:1px solid var(--border);border-radius:12px;padding:15px}
.focus-model{font-weight:800;margin:5px 0 12px}
.progress{height:7px;border-radius:10px;background:#edf0f6;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--blue);border-radius:10px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}
.field small{display:block;color:var(--muted);font-size:11px;margin-top:6px}
.field-full{grid-column:1/-1}
.store-lock{background:#f4f6fa;color:#626d80}
.preview{background:#f6f7fb;border-radius:11px;padding:15px;font-size:13px;line-height:1.8}
.preview strong{color:var(--blue)}
.form-actions{display:flex;justify-content:flex-end;margin-top:16px}
.notice{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.notice.error{background:#fff0f0;color:#b42323}
.notice.success{background:#eaf8ef;color:#176c3b}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#eef1ff,#f7f8fc)}
.login-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:0 18px 55px #18285a12}
.login-card .brand{margin-bottom:12px}
.login-card h1{font-size:25px;margin:20px 0 8px}
.login-field{margin-top:16px}
.login-field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}
.login-card .btn{width:100%;margin-top:20px;min-height:46px}
.login-help{font-size:12px;color:var(--muted);line-height:1.6;margin-top:16px}
.loading{padding:35px;text-align:center;color:var(--muted);font-size:13px}
.mobile-nav{display:none}
#toast{position:fixed;bottom:24px;right:24px;max-width:calc(100% - 32px);background:#172033;color:white;padding:14px 18px;border-radius:12px;font-size:13px;box-shadow:0 8px 30px #0002;z-index:50}
.section-label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:12px}
@media(max-width:900px){
 .sidebar{width:190px}
 .main{padding:20px 16px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .kpi-value{font-size:24px}
}
@media(max-width:600px){
 .topbar{height:64px;padding:0 15px}
 .brand{font-size:17px}
 .userbox{gap:9px}
 .user-name{font-size:12px}
 .user-code{font-size:10px}
 .topbar .btn{padding:8px 10px;font-size:11px}
 .layout{display:block;min-height:calc(100vh - 64px)}
 .sidebar{display:none}
 .main{padding:18px 12px 90px}
 .page-head{align-items:flex-start;margin-bottom:17px}
 h1{font-size:22px}
 .toolbar{width:100%}
 .month-input{flex:1;min-width:0;width:auto}
 .card{padding:15px;margin-bottom:12px}
 .kpis{gap:9px}
 .kpi{padding:13px}
 .kpi-label{font-size:10px}
 .kpi-value{font-size:22px}
 .kpi-note{font-size:10px}
 .grid3{grid-template-columns:1fr}
 .weekbox{padding:12px}
 .focus-list{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr;gap:13px}
 .field-full{grid-column:auto}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:20;padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}
 .mobile-nav button{border:0;background:transparent;color:#727b8e;font-size:10px;padding:7px 4px;flex:1;border-radius:9px}
 .mobile-nav button.active{color:var(--blue);background:var(--blue-light);font-weight:800}
 .mobile-nav span{display:block;font-size:17px;margin-bottom:4px}
 .form-actions .btn{width:100%}
 #toast{bottom:80px;right:12px}
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand">SAMSUNG DASHBOARD</div>
    <div class="subtitle">Store Sales Performance</div>
    <h1>Login</h1>
    <div class="subtitle">Masuk menggunakan akun store atau akun pengelola.</div>
    <form id="loginForm">
      <div class="login-field">
        <label for="loginUser">USER ID</label>
        <input id="loginUser" autocomplete="username" required placeholder="Masukkan User ID">
      </div>
      <div class="login-field">
        <label for="loginPassword">PASSWORD</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Masukkan password">
      </div>
      <div id="loginError" class="notice error hidden"></div>
      <button id="loginButton" class="btn btn-primary" type="submit">LOGIN</button>
    </form>
    <div class="login-help">Akses data dibatasi sesuai role dan store pada USER_ACCESS.</div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="brand">SAMSUNG DASHBOARD</div>
    <div class="userbox">
      <div>
        <div class="user-name" id="topUserName">Store</div>
        <div class="user-code" id="topUserCode">-</div>
      </div>
      <button class="btn" id="logoutButton">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div id="toast" class="hidden"></div>
      <div id="pageContent"><div class="loading">Memuat dashboard...</div></div>
    </main>
  </div>
  <nav id="mobileNav" class="mobile-nav"></nav>
</div>

<script>
'use strict';

/* ======================================================
   CONFIG
====================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwQkb38EnhSq-VAHv2VpjuUpKLxE7ySOXM3aDKd4bPVXE2DvGS2Iqi3Ldv4LpNv3PkG/exec';

const state = {
  token: '',
  user: null,
  page: 'overview',
  month: getCurrentMonth(),
  metric: 'QTY',
  types: [],
  products: [],
  stores: [],
  focus: [],
  targets: [],
  overview: null,
  performance: null
};

function getCurrentMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function todayString() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}

function numberValue(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function money(value) {
  const n = numberValue(value);
  if (Math.abs(n) >= 1000000) {
    const v = n / 1000000;
    return v.toLocaleString('id-ID', {
      maximumFractionDigits: 1,
      minimumFractionDigits: 0
    }) + 'jt';
  }
  return n.toLocaleString('id-ID', {maximumFractionDigits:0});
}

function integer(value) {
  return numberValue(value).toLocaleString('id-ID', {
    maximumFractionDigits: 2
  });
}

function metricFormat(value) {
  return state.metric === 'VALUE' ? money(value) : integer(value);
}

function pct(value) {
  return numberValue(value).toLocaleString('id-ID', {
    maximumFractionDigits: 1
  }) + '%';
}

function achievementClass(value) {
  const n = numberValue(value);
  if (n >= 100) return 'good';
  if (n >= 90) return 'warn';
  return 'bad';
}

function monthLabel(month) {
  if (!month) return '-';
  const parts = month.split('-').map(Number);
  if (parts.length !== 2 || !parts[0] || !parts[1]) return month;
  return new Date(parts[0], parts[1] - 1, 1)
    .toLocaleDateString('id-ID', {month:'long',year:'numeric'});
}

function showToast(message, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.style.background = isError ? '#a82323' : '#172033';
  el.classList.remove('hidden');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => el.classList.add('hidden'), 3500);
}

function showError(containerId, message) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.textContent = message;
  el.classList.remove('hidden');
}

function hideError(containerId) {
  const el = document.getElementById(containerId);
  if (el) el.classList.add('hidden');
}


/* ======================================================
   API
====================================================== */

async function api(action, data = {}, authenticated = true) {
  const params = new URLSearchParams();
  params.set('action', action);

  Object.entries(data).forEach(([key, value]) => {
    if (value !== undefined && value !== null) {
      params.set(key, String(value));
    }
  });

  if (authenticated && state.token) {
    params.set('token', state.token);
  }

  const response = await fetch(API_URL + '?' + params.toString(), {
    method: 'GET',
    cache: 'no-store',
    redirect: 'follow'
  });

  if (!response.ok) {
    throw new Error('Server error: ' + response.status);
  }

  let result;
  try {
    result = await response.json();
  } catch (_) {
    throw new Error('Respons API bukan JSON. Periksa deployment Apps Script.');
  }

  if (result.success === false) {
    throw new Error(result.message || 'Permintaan gagal.');
  }

  return result;
}


/* ======================================================
   LOGIN / LOGOUT
====================================================== */

document.getElementById('loginForm').addEventListener('submit', async event => {
  event.preventDefault();

  const button = document.getElementById('loginButton');
  button.disabled = true;
  button.textContent = 'LOGIN...';
  hideError('loginError');

  try {
    const userId = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPassword').value;

    const result = await api('login', {userId, password}, false);

    state.token = result.token;
    state.user = result.user;
    state.page = 'overview';
    state.month = getCurrentMonth();
    state.metric = 'QTY';

    document.getElementById('loginPassword').value = '';
    openApp();
  } catch (error) {
    showError('loginError', error.message || 'Login gagal.');
  } finally {
    button.disabled = false;
    button.textContent = 'LOGIN';
  }
});

document.getElementById('logoutButton').addEventListener('click', async () => {
  try {
    if (state.token) await api('logout', {});
  } catch (_) {}

  state.token = '';
  state.user = null;
  state.overview = null;
  state.performance = null;

  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
});

function openApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');

  document.getElementById('topUserName').textContent =
    state.user.name || state.user.userId || 'User';

  document.getElementById('topUserCode').textContent =
    state.user.storeCode || state.user.role || '';

  buildNavigation();
  navigate('overview');
}


/* ======================================================
   NAVIGATION
====================================================== */

function menuItems() {
  const items = [
    {id:'overview', label:'Overview', icon:'⌂'},
    {id:'performance', label:'Performance', icon:'▥'},
    {id:'input', label:'Input Sales', icon:'＋'},
    {id:'focus', label:'Focus Product', icon:'☆'}
  ];

  if (['ADMIN','TSH','LEADER'].includes(String(state.user.role).toUpperCase())) {
    items.push(
      {id:'product', label:'Product Master', icon:'▤'},
      {id:'target', label:'Target', icon:'◎'},
      {id:'master', label:'Master Type', icon:'⚙'}
    );
  }

  return items;
}

function buildNavigation() {
  const items = menuItems();

  document.getElementById('sidebar').innerHTML = items.map(item =>
    `<button class="navbtn ${item.id === state.page ? 'active':''}"
      data-page="${item.id}">${item.label}</button>`
  ).join('');

  document.getElementById('mobileNav').innerHTML = items
    .filter(item => ['overview','performance','input','focus'].includes(item.id))
    .map(item => `
      <button class="${item.id === state.page ? 'active':''}" data-page="${item.id}">
        <span>${item.icon}</span>${item.label}
      </button>
    `).join('');

  document.querySelectorAll('[data-page]').forEach(button => {
    button.addEventListener('click', () => navigate(button.dataset.page));
  });
}

async function navigate(page) {
  state.page = page;
  buildNavigation();

  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="loading">Memuat data...</div>';

  try {
    if (page === 'overview') {
      await loadOverview();
      renderOverview();
    } else if (page === 'performance') {
      await loadPerformance();
      renderPerformance();
    } else if (page === 'input') {
      await loadTypes();
      await loadProducts();
      renderInputSales();
    } else if (page === 'focus') {
      await loadFocus();
      renderFocus();
    } else if (page === 'product') {
      await loadTypes();
      await loadProducts();
      renderProducts();
    } else if (page === 'target') {
      await loadTypes();
      await loadStores();
      await loadTargets();
      renderTargets();
    } else if (page === 'master') {
      await loadTypes();
      renderMaster();
    } else {
      content.innerHTML = '<div class="card empty">Menu tidak ditemukan.</div>';
    }
  } catch (error) {
    content.innerHTML = `
      <div class="card">
        <div class="card-title">Data gagal dimuat</div>
        <div class="notice error">${escapeHtml(error.message)}</div>
        <button class="btn btn-primary" onclick="navigate('${escapeHtml(page)}')">Coba Lagi</button>
      </div>`;
  }
}


/* ======================================================
   DATA LOADERS
====================================================== */

async function loadOverview() {
  state.overview = await api('getOverview', {
    month: state.month,
    metric: state.metric
  });
}

async function loadPerformance() {
  state.performance = await api('getPerformance', {
    month: state.month,
    metric: state.metric
  });
}

async function loadTypes() {
  const result = await api('getTypes');
  state.types = result.rows || [];
}

async function loadProducts(type = '') {
  const result = await api('getProducts', {type});
  state.products = result.rows || [];
}

async function loadFocus() {
  const result = await api('getFocusProducts', {month:state.month});
  state.focus = result.rows || [];
}

async function loadTargets() {
  const result = await api('getTargets', {month:state.month});
  state.targets = result.rows || [];
}

async function loadStores() {
  const result = await api('getStores');
  state.stores = result.rows || [];
}


/* ======================================================
   SHARED FILTERS
====================================================== */

function filtersHtml() {
  return `
    <div class="toolbar">
      <input class="month-input" id="monthFilter" type="month"
        value="${escapeHtml(state.month)}" aria-label="Pilih bulan">
      <button class="btn metric-btn ${state.metric === 'QTY' ? 'active':''}"
        id="qtyButton">QTY</button>
      <button class="btn metric-btn ${state.metric === 'VALUE' ? 'active':''}"
        id="valueButton">VALUE</button>
    </div>`;
}

function bindFilters(onChange) {
  const month = document.getElementById('monthFilter');
  const qty = document.getElementById('qtyButton');
  const value = document.getElementById('valueButton');

  if (month) {
    month.addEventListener('change', async () => {
      if (month.value) state.month = month.value;
      await onChange();
    });
  }

  if (qty) {
    qty.addEventListener('click', async () => {
      state.metric = 'QTY';
      await onChange();
    });
  }

  if (value) {
    value.addEventListener('click', async () => {
      state.metric = 'VALUE';
      await onChange();
    });
  }
}

function pageHeader(title, subtitle, withFilters = false) {
  return `
    <div class="page-head">
      <div>
        <h1>${escapeHtml(title)}</h1>
        <div class="subtitle">${escapeHtml(subtitle)}</div>
      </div>
      ${withFilters ? filtersHtml() : ''}
    </div>`;
}


/* ======================================================
   OVERVIEW
====================================================== */

function renderOverview() {
  const d = state.overview || {};
  const actual = numberValue(d.actual);
  const target = numberValue(d.target);
  const achievement = numberValue(d.achievement);
  const estimation = numberValue(d.estimation);

  const weeks = Array.isArray(d.weeks) ? d.weeks : [];
  const series = Array.isArray(d.series) ? d.series : [];
  const focus = Array.isArray(d.focus) ? d.focus : [];

  document.getElementById('pageContent').innerHTML = `
    ${pageHeader('Overview', 'Performance store bulan berjalan', true)}

    <section class="card">
      <div class="card-title">Focus Product</div>
      <div class="card-subtitle">${escapeHtml(monthLabel(state.month))}</div>
      ${focus.length ? `
        <div class="focus-list">
          ${focus.map(renderFocusCard).join('')}
        </div>
      ` : `<div class="empty">Belum ada focus product bulan ini.</div>`}
    </section>

    <section class="kpis">
      <div class="kpi">
        <div class="kpi-label">Target</div>
        <div class="kpi-value">${metricFormat(target)}</div>
        <div class="kpi-note">${state.metric === 'VALUE' ? 'Nilai target' : 'Target unit'}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Actual</div>
        <div class="kpi-value">${metricFormat(actual)}</div>
        <div class="kpi-note">Penjualan tercatat</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Achievement</div>
        <div class="kpi-value ${achievementClass(achievement)}">${pct(achievement)}</div>
        <div class="kpi-note">Actual dibanding target</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Estimation</div>
        <div class="kpi-value">${metricFormat(estimation)}</div>
        <div class="kpi-note">Estimasi akhir bulan</div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">Last 3 Weeks</div>
      <div class="card-subtitle">Pergerakan penjualan (${state.metric})</div>
      ${weeks.length ? `
        <div class="grid3">
          ${weeks.map(w => `
            <div class="weekbox">
              <div class="weekname">${escapeHtml(w.label || 'Week')}</div>
              <div class="weekvalue">${metricFormat(w.actual)}</div>
              <div class="weekdate">${escapeHtml(w.start || '')} → ${escapeHtml(w.end || '')}</div>
            </div>
          `).join('')}
        </div>
      ` : '<div class="empty">Belum ada data mingguan.</div>'}
    </section>

    <section class="card">
      <div class="card-title">Performance by Series</div>
      <div class="card-subtitle">Achievement per series</div>
      ${series.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Series</th><th>Target</th><th>Actual</th><th>Achievement</th>
            </tr></thead>
            <tbody>
              ${series.map(r => `
                <tr>
                  <td>${escapeHtml(r.type)}</td>
                  <td>${metricFormat(r.target)}</td>
                  <td>${metricFormat(r.actual)}</td>
                  <td class="${achievementClass(r.achievement)}">${pct(r.achievement)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      ` : '<div class="empty">Belum ada data series.</div>'}
    </section>`;

  bindFilters(async () => {
    await loadOverview();
    renderOverview();
  });
}

function renderFocusCard(f) {
  const target = numberValue(f.target);
  const actual = numberValue(f.actual);
  const achievement = numberValue(f.achievement);
  const width = Math.max(0, Math.min(100, achievement));

  return `
    <div class="focus-item">
      <div class="section-label">${escapeHtml(f.type || '')}</div>
      <div class="focus-model">${escapeHtml(f.model || '-')}</div>
      <div class="subtitle">Target: ${metricFormat(target)}</div>
      <div style="margin-top:7px;font-size:13px">Actual: <strong>${metricFormat(actual)}</strong></div>
      <div style="margin-top:8px" class="${achievementClass(achievement)}">${pct(achievement)}</div>
      <div class="progress"><div style="width:${width}%"></div></div>
    </div>`;
}

/* ======================================================
   INPUT SALES
====================================================== */

function renderInputSales() {
  const types = state.types || [];
  const products = state.products || [];
  const storeLabel = state.user.storeCode || 'Store sesuai akun login';

  document.getElementById('pageContent').innerHTML = `
    ${pageHeader('Input Sales', 'Input transaksi berdasarkan QTY. Value otomatis dari Product Master.')}

    <form id="salesForm">
      <section class="card">
        <div class="card-title">Store</div>
        <div class="card-subtitle">Store otomatis mengikuti akun login.</div>
        <input class="store-lock" value="${escapeHtml(storeLabel)}" readonly>
      </section>

      <section class="card">
        <div class="form-grid">
          <div class="field">
            <label for="salesDate">TANGGAL</label>
            <input id="salesDate" type="date" value="${todayString()}" max="${todayString()}" required>
            <small>Lu bisa memilih tanggal sebelumnya jika lupa input.</small>
          </div>

          <div class="field">
            <label for="salesType">TYPE / SERIES</label>
            <select id="salesType" required>
              <option value="">Pilih Type</option>
              ${types.map(t => `
                <option value="${escapeHtml(t.TYPE_NAME)}">${escapeHtml(t.TYPE_NAME)}</option>
              `).join('')}
            </select>
          </div>

          <div class="field">
            <label for="salesProduct">PRODUCT</label>
            <select id="salesProduct" required>
              <option value="">Pilih Product</option>
              ${products.map(p => `
                <option value="${escapeHtml(p.MODEL)}"
                  data-value="${numberValue(p.VALUE)}"
                  data-type="${escapeHtml(p.TYPE)}">
                  ${escapeHtml(p.MODEL)}
                </option>
              `).join('')}
            </select>
          </div>

          <div class="field">
            <label for="salesQty">QTY</label>
            <input id="salesQty" type="number" min="1" step="1" placeholder="Masukkan QTY" required>
          </div>

          <div class="field field-full">
            <div class="preview" id="salesPreview">Pilih product dan QTY.</div>
          </div>
        </div>

        <div id="salesError" class="notice error hidden" style="margin-top:14px"></div>
        <div class="form-actions">
          <button class="btn btn-primary" id="saveSalesButton" type="submit">SIMPAN SALES</button>
        </div>
      </section>
    </form>`;

  const typeEl = document.getElementById('salesType');
  const productEl = document.getElementById('salesProduct');
  const qtyEl = document.getElementById('salesQty');

  typeEl.addEventListener('change', () => {
    const selectedType = typeEl.value;
    const filtered = products.filter(p => String(p.TYPE) === selectedType);

    productEl.innerHTML = '<option value="">Pilih Product</option>' +
      filtered.map(p => `
        <option value="${escapeHtml(p.MODEL)}" data-value="${numberValue(p.VALUE)}">
          ${escapeHtml(p.MODEL)}
        </option>
      `).join('');

    updateSalesPreview();
  });

  productEl.addEventListener('change', updateSalesPreview);
  qtyEl.addEventListener('input', updateSalesPreview);

  document.getElementById('salesForm').addEventListener('submit', saveSalesFromForm);
}

function updateSalesPreview() {
  const productEl = document.getElementById('salesProduct');
  const qtyEl = document.getElementById('salesQty');
  const preview = document.getElementById('salesPreview');
  if (!productEl || !qtyEl || !preview) return;

  const option = productEl.options[productEl.selectedIndex];
  const unitValue = option ? numberValue(option.dataset.value) : 0;
  const qty = numberValue(qtyEl.value);

  if (!productEl.value || qty <= 0) {
    preview.textContent = 'Pilih product dan QTY.';
    return;
  }

  preview.innerHTML = `
    Harga Master: <strong>${integer(unitValue)}</strong>
    &nbsp; × &nbsp; QTY: <strong>${integer(qty)}</strong>
    &nbsp; = &nbsp; VALUE: <strong>${integer(unitValue * qty)}</strong>`;
}

async function saveSalesFromForm(event) {
  event.preventDefault();
  hideError('salesError');

  const button = document.getElementById('saveSalesButton');
  button.disabled = true;
  button.textContent = 'MENYIMPAN...';

  const date = document.getElementById('salesDate').value;
  const type = document.getElementById('salesType').value;
  const model = document.getElementById('salesProduct').value;
  const qty = document.getElementById('salesQty').value;

  try {
    const result = await api('saveSales', {date, type, model, qty});
    showToast('Sales berhasil disimpan.');

    document.getElementById('salesQty').value = '';
    updateSalesPreview();

    if (state.page === 'input') {
      // Refresh latest data after saving.
      await loadOverview();
    }

    console.log('Sales saved:', result.data);
  } catch (error) {
    showError('salesError', error.message || 'Gagal menyimpan sales.');
  } finally {
    button.disabled = false;
    button.textContent = 'SIMPAN SALES';
  }
}
